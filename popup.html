<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manga Notifier</title>

    <link rel="stylesheet" href="popup.css">

</head>

<body>
    <div class="popup-shell">
    <div class="headerbar">
        <div class="header-copy">
            <h1 id="appTitle">Manga Notifier</h1>

            <div
                id="lastGlobal"
                class="last-global"
                title="Dernière vérification"
            >
                Jamais vérifié
            </div>
        </div>

        <button
            id="searchToggle"
            class="tool"
            title="Rechercher"
            aria-label="Rechercher"
        >
            🔍
        </button>

        <details class="settings">
            <summary
                title="Ajouter une lecture et réglages"
                aria-label="Ajouter une lecture et réglages"
            ></summary>

            <div class="settings-body">
                <div class="row">
                    <input
                        id="url"
                        placeholder="URL du manga (Mgeko, MangaDex, MangaFreak, SushiScan, WEBTOON)"
                    >
                    <button id="add">Ajouter</button>
                </div>

                <div id="msg" class="muted"></div>

                <div class="backup-row">
                    <button
                        id="importTxt"
                        class="secondary"
                        title="Importer une sauvegarde TXT"
                        aria-label="Importer une sauvegarde TXT"
                    >
                        Import Library
                    </button>

                    <button
                        id="exportTxt"
                        class="secondary"
                        title="Exporter la bibliothèque TXT"
                        aria-label="Exporter la bibliothèque TXT"
                    >
                        Export Lib TXT
                    </button>
                </div>

                <input
                    id="txtFile"
                    type="file"
                    accept=".txt,text/plain"
                    hidden
                >

                <div class="backup-row">
                    <button id="importJson" class="secondary" type="button" title="Importer une sauvegarde JSON" aria-label="Importer une sauvegarde JSON">Import Lib JSON</button>
                    <button id="exportJson" class="secondary" type="button" title="Exporter une sauvegarde JSON" aria-label="Exporter une sauvegarde JSON">Export Lib JSON</button>
                </div>

                <input id="jsonFile" type="file" accept=".json,application/json" hidden>

                <div id="archiveNote" class="archive-note">
                    Les œuvres supprimées des alertes restent dans l’archive TXT/interne.
                </div>

                <div class="row" style="margin-top: 9px">
                    <label
                        id="intervalLabel"
                        class="muted"
                        for="interval"
                        style="white-space: nowrap"
                    >
                        Vérification
                    </label>

                    <select id="interval">
                        <option value="5"></option>
                        <option value="15"></option>
                        <option value="30"></option>
                        <option value="60"></option>
                        <option value="180"></option>
                        <option value="300"></option>
                        <option value="600"></option>
                        <option value="1440"></option>
                    </select>
                </div>

                <div class="row" style="margin-top: 9px">
                    <label
                        id="interfaceLanguageLabel"
                        class="muted"
                        for="interfaceLanguage"
                        style="white-space: nowrap"
                    >
                        Langue
                    </label>

                    <select id="interfaceLanguage">
                        <option value="fr">Français</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="it">Italiano</option>
                        <option value="zh">中文</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="pt">Português</option>
                    </select>
                </div>

                <div class="setting-section">
                    <div id="displayTitle" class="setting-section-title">
                        Affichage
                    </div>

                    <div class="row">
                        <label
                            id="sortLabel"
                            class="muted"
                            for="sortMode"
                            style="white-space: nowrap"
                        >
                            Tri
                        </label>

                        <select id="sortMode">
                            <option value="recent">Récent</option>
                            <option value="title">Titre</option>
                            <option value="source">Source</option>
                        </select>
                    </div>

                    <div class="row" style="margin-top: 7px">
                        <label
                            id="densityLabel"
                            class="muted"
                            for="densityMode"
                            style="white-space: nowrap"
                        >
                            Mode
                        </label>

                        <select id="densityMode">
                            <option value="normal">Normal</option>
                            <option value="compact">Compact</option>
                        </select>
                    </div>
                </div>

                <div class="size-settings">
                    <div id="windowSizeTitle" class="size-settings-title">
                        Taille de la fenêtre
                    </div>

                    <div class="size-row">
                        <label id="popupWidthLabel" class="muted" for="popupWidth">
                            Largeur
                        </label>

                        <input
                            id="popupWidth"
                            type="range"
                            min="360"
                            max="800"
                            step="10"
                            value="410"
                        >

                        <input
                            id="popupWidthNumber"
                            type="number"
                            min="360"
                            max="800"
                            step="10"
                            value="410"
                            aria-label="Largeur du popup en pixels"
                        >
                    </div>

                    <div class="size-row">
                        <label id="popupHeightLabel" class="muted" for="popupHeight">
                            Longueur
                        </label>

                        <input
                            id="popupHeight"
                            type="range"
                            min="300"
                            max="600"
                            step="10"
                            value="600"
                        >

                        <input
                            id="popupHeightNumber"
                            type="number"
                            min="300"
                            max="600"
                            step="10"
                            value="600"
                            aria-label="Longueur du popup en pixels"
                        >
                    </div>

                    <button
                        id="resetPopupSize"
                        class="size-reset"
                        type="button"
                    >
                        Taille par défaut
                    </button>
                </div>

                <div class="request-actions">
                    <button
                        id="requestSite"
                        class="request-site"
                        type="button"
                        title="Demander l’ajout d’un site"
                        aria-label="Demander l’ajout d’un site"
                    >
                        Demander l’ajout d’un site
                    </button>

                    <button
                        id="githubProject"
                        class="github-project"
                        type="button"
                        title="Projet GitHub"
                        aria-label="Projet GitHub"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.22c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.57-.29-5.27-1.29-5.27-5.73 0-1.27.45-2.3 1.19-3.12-.12-.29-.52-1.48.11-3.08 0 0 .97-.31 3.16 1.19a10.94 10.94 0 0 1 5.76 0c2.19-1.5 3.16-1.19 3.16-1.19.63 1.6.23 2.79.11 3.08.74.82 1.19 1.85 1.19 3.12 0 4.45-2.71 5.43-5.29 5.72.42.36.79 1.07.79 2.16v3.2c0 .31.21.68.8.56A11.5 11.5 0 0 0 12 .7Z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </details>

        <div class="toolbar">
            <button
                id="check"
                class="tool primary"
                title="Vérifier maintenant"
                aria-label="Vérifier maintenant"
            >
                ↻
            </button>
        </div>
    </div>

    <div class="library-area">
        <div id="menuBackdrop" class="menu-backdrop" aria-hidden="true"></div>

        <div id="importOverlay" class="import-overlay" aria-hidden="true">
            <div class="import-overlay-card" role="status" aria-live="polite">
                <div id="importOverlayTitle" class="import-overlay-title">Bibliothèque en cours…</div>
                <div id="importOverlaySubtitle" class="import-overlay-subtitle">Veuillez patienter</div>
            </div>
        </div>

        <div class="library-content">
            <div id="searchWrap" class="search-wrap">
                <div class="search-box">
                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Rechercher un manga…"
                        autocomplete="off"
                    >

                    <button
                        id="searchClear"
                        class="search-clear"
                        type="button"
                        title="Effacer la recherche"
                        aria-label="Effacer la recherche"
                    >
                        ✕
                    </button>
                </div>
            </div>

            <div id="libraryLabel" class="library-label">Bibliothèque</div>
            <div id="list"></div>
        </div>
    </div>

    </div>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
</body>
</html>
